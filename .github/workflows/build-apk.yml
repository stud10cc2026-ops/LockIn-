name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "$JAVA_HOME"
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          MAJOR_VERSION=$(echo "$JAVA_VERSION_OUTPUT" | sed -E 's/.*version "([0-9]+).*/\1/')
          
          if [[ -z "$MAJOR_VERSION" || ! "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect Java major version from output: $JAVA_VERSION_OUTPUT"
            exit 1
          fi
          
          echo "Detected Java Major Version: $MAJOR_VERSION"
          
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, but detected version is $MAJOR_VERSION"
            exit 1
          fi
          
          echo "Java environment verification successful."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore confirmed at ./debug.keystore"

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]]; then
            echo "Verified expected APK exists and is non-empty: $EXPECTED_APK"
          else
            echo "Error: Expected APK ($EXPECTED_APK) is missing or invalid."
            echo "Searching for APKs inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR="${{ runner.temp }}/release_assets"
          mkdir -p "$TEMP_DIR"
          
          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO_NAME" | awk -F'/' '{print $2}' | tr -cd 'a-zA-Z0-9_-')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="app"
          fi
          
          RELEASE_APK_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          RELEASE_APK_PATH="${TEMP_DIR}/${RELEASE_APK_NAME}"
          
          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_APK_PATH"
          
          if [ ! -s "$RELEASE_APK_PATH" ]; then
            echo "Error: Prepared release APK $RELEASE_APK_PATH is missing or empty."
            exit 1
          fi
          
          echo "Prepared release APK asset: $RELEASE_APK_PATH"
          echo "asset_path=$RELEASE_APK_PATH" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_APK_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== GitHub CLI Version ==="
          gh --version
          
          RELEASE_APK="${{ steps.prepare_asset.outputs.asset_path }}"
          
          if [ ! -f "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ] || [[ "$RELEASE_APK" != *.apk ]]; then
            echo "Error: Release APK validation failed ($RELEASE_APK)."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES=$(cat <<EOF
          - Automatically generated debug APK.
          - Built by GitHub Actions.
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          - Intended for testing.
          - Not a Play Store production release.
          - Built as the project's existing debug configuration.
          EOF
          )
          
          gh release create "$TAG" "$RELEASE_APK" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$NOTES"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          APK_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=== Release Published Successfully ==="
            gh release view "$TAG"
            
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: $APK_NAME"
            
            {
              echo "### 🎉 Debug APK Release Published"
              echo ""
              echo "- **Release Page:** [$TITLE]($RELEASE_URL)"
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **APK Filename:** \`$APK_NAME\`"
              echo ""
              echo "The debug APK is available directly under the release's **Assets** section at the URL above."
              echo "The Actions artifact (\`app-debug-apk\`) is also available as a backup under the workflow run summary."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "=== Warning: Release Publishing Failed ==="
            echo "Warning: GitHub Release publishing failed or was skipped."
            echo "APK building succeeded, and the debug APK is preserved."
            echo "The Actions artifact 'app-debug-apk' remains available for download from this workflow run."
            
            {
              echo "### ⚠️ GitHub Release Publishing Failed"
              echo ""
              echo "APK building succeeded, but publishing to GitHub Releases failed."
              echo "The debug APK is preserved and available as the Actions artifact **\`app-debug-apk\`** under the workflow run summary."
            } >> $GITHUB_STEP_SUMMARY
          fi
