name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME is: $JAVA_HOME"
          java -version
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version is $JAVA_VER, but version 17 or higher is required."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found, creating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ -f ./debug.keystore ]; then
            echo "Temporary debug keystore verified at ./debug.keystore."
          else
            echo "Error: Failed to create temporary debug keystore."
            exit 1
          fi

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK build output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
            echo "Verified expected debug APK exists at $APK_PATH"
          else
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/_/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TEMP_DIR="${RUNNER_TEMP}/release-asset-dir"
          mkdir -p "$TEMP_DIR"
          ASSET_PATH="${TEMP_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          
          if [ -f "$ASSET_PATH" ] && [ -s "$ASSET_PATH" ]; then
            echo "Prepared release asset at: $ASSET_PATH"
            echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
            echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Failed to prepare release asset."
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prep_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset path invalid or file missing."
            exit 1
          fi
          
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Automatically generated debug APK.
          Built by GitHub Actions.
          Run number: ${{ github.run_number }}
          Run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          Intended for testing.
          Not a Play Store production release.
          Built as the project's existing debug configuration."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            ASSET_NAME="${{ steps.prep_asset.outputs.asset_name }}"
            
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: $ASSET_NAME"
            
            echo "### 🚀 Debug APK Build & Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "**Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "**Release Tag:** \`$TAG_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "**APK Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK is available for download under the **Assets** section of the release page." >> $GITHUB_STEP_SUMMARY
            echo "The \`app-debug-apk\` Actions artifact is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "=== WARNING: GitHub Release Publishing Failed ==="
            echo "APK compilation and verification succeeded, but GitHub Release creation failed."
            echo "The compiled debug APK remains available as the Actions artifact 'app-debug-apk'."
            
            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Failed)" >> $GITHUB_STEP_SUMMARY
            echo "APK building and verification succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing failed, but the debug APK is available as the Actions artifact **app-debug-apk**." >> $GITHUB_STEP_SUMMARY
          fi
