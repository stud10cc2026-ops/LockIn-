name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Verifying Java environment..."
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          # Detect active Java major version
          JAVA_VERSION_FULL=$(java -version 2>&1 | head -n 1)
          echo "Full Java version output: $JAVA_VERSION_FULL"
          
          # Extract major version using various common patterns
          if [[ "$JAVA_VERSION_FULL" =~ \"([0-9]+) ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          elif [[ "$JAVA_VERSION_FULL" =~ \ ([0-9]+)\. ]]; then
            JAVA_MAJOR="${BASH_REMATCH[1]}"
          else
            echo "Error: Java version cannot be detected."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java version is lower than 17. Detected: $JAVA_MAJOR"
            exit 1
          fi
          echo "Confirm: Java is 17 or newer."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Creating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          
          if [ -f ./debug.keystore ]; then
            echo "Confirm that ./debug.keystore exists."
          else
            echo "Error: Keystore creation failed."
            exit 1
          fi

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ] && [ -s "$APK_FILE" ] && [[ "$APK_FILE" == *.apk ]]; then
            echo "Confirm: app/build/outputs/apk/debug/app-debug.apk exists, is a regular file, is not empty, and ends with .apk."
          else
            echo "Error: APK verification failed."
            echo "Searching ONLY inside: app/build/outputs/apk"
            find app/build/outputs/apk -maxdepth 3 -name "*.apk"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          # Sanitize repository name
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2 | sed 's/[^a-zA-Z0-9._-]/_/g')
          RUN_NUMBER="${{ github.run_number }}"
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${RUN_NUMBER}.apk"
          
          # Create temporary directory on the runner
          TEMP_RELEASE_DIR="github_release_asset"
          mkdir -p "$TEMP_RELEASE_DIR"
          
          # Copy verified APK and rename
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_RELEASE_DIR/$RELEASE_FILENAME"
          
          echo "asset_path=$TEMP_RELEASE_DIR/$RELEASE_FILENAME" >> $GITHUB_OUTPUT
          echo "asset_name=$RELEASE_FILENAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version
          
          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ] || [[ "$RELEASE_ASSET" != *.apk ]]; then
            echo "Error: Release asset validation failed before creation."
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          echo "Creating GitHub Release..."
          gh release create "$TAG" "$RELEASE_ASSET" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "- Automatically generated debug APK.
          - Built by GitHub Actions.
          - Run number: ${{ github.run_number }}
          - Run attempt: ${{ github.run_attempt }}
          - Source commit SHA: ${{ github.sha }}
          - Intended for testing.
          - Not a Play Store production release.
          - Built as the project's existing debug configuration."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "Release succeeded."
            gh release view "$TAG"
            
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release tag: $TAG"
            echo "Release title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK filename: ${{ steps.prepare_asset.outputs.asset_name }}"
            
            echo "### APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "The debug APK is available under the release's Assets section: [View Release]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "Actions artifact is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "### APK Build & Release Summary" >> $GITHUB_STEP_SUMMARY
            echo "Warning: Release publishing failed." >> $GITHUB_STEP_SUMMARY
            echo "APK building succeeded. app-debug-apk remains available as an Actions artifact." >> $GITHUB_STEP_SUMMARY
            
            echo "Warning: Release publishing failed."
            echo "State: APK building succeeded."
            echo "State: app-debug-apk remains available."
          fi
